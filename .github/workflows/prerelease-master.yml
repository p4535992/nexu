# Cross-platform release-candidate build from the required modernization branch.
name: Publish NexU pre-release

on:
  push:
    branches:
      - spring-boot-modernization-2
    paths:
      - '.github/workflows/prerelease-master.yml'
      - 'pom.xml'
      - 'nexu-core/**'
      - 'nexu-app/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'licenses/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexu-prerelease-spring-boot-modernization-2
  cancel-in-progress: true

env:
  BASE_VERSION: 1.25.0
  SOURCE_BRANCH: spring-boot-modernization-2
  # Runs 30-33 were cancelled cleanup builds. Run 34 publishes the final rc.3.
  RC_RUN_OFFSET: 31

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install packaging and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot rpm libpcsclite1 pcscd xvfb

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --errors clean verify 2>&1 | tee linux-verify.log

      - name: Verify NexU 1.25 and Spring Boot 4 runtime
        shell: bash
        run: |
          set -euo pipefail
          JAR=nexu-app/target/nexu-app.jar
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'BOOT-INF/lib/nexu-core-1.25.0-SNAPSHOT.jar'
          jar tf "$JAR" | grep -q 'BOOT-INF/lib/spring-boot-4.1.0.jar'
          jar tf "$JAR" | grep -Eq 'BOOT-INF/lib/spring-core-7\.0\.[0-9]+\.jar'
          jar tf "$JAR" | grep -Eq 'BOOT-INF/lib/tomcat-embed-core-11\.0\.[0-9]+\.jar'
          test "$(unzip -p "$JAR" BOOT-INF/classes/version.txt)" = '1.25.0-SNAPSHOT'
          ! grep -RIn --exclude-dir=target --exclude='*.md' \
            -E '2\.0\.0|nexu:2\.0' pom.xml nexu-core nexu-app .github/workflows

      - name: Build portable, DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          RC_NUMBER="$((GITHUB_RUN_NUMBER - RC_RUN_OFFSET))"
          if [ "$RC_NUMBER" -lt 1 ]; then
            echo "Invalid release-candidate number: $RC_NUMBER" >&2
            exit 1
          fi
          RELEASE_VERSION="${BASE_VERSION}-rc.${RC_NUMBER}"
          OUT="nexu-app/target/jpackage"

          bash nexu-app/src/jpackage/package-linux.sh \
            nexu-app/target/nexu-app.jar \
            "$OUT" \
            "$BASE_VERSION"

          jpackage \
            --type rpm \
            --app-image "$OUT/NexU" \
            --app-version "$BASE_VERSION" \
            --dest "$OUT"

          test -f "$OUT/NexU/LOGS.txt"

          RPM_PACKAGE="$(find "$OUT" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$RPM_PACKAGE"
          test "$(rpm -qp --queryformat '%{VERSION}' "$RPM_PACKAGE")" = "$BASE_VERSION"

          mkdir -p release-assets
          cp nexu-app/target/nexu-app.jar \
            "release-assets/nexu-app-${RELEASE_VERSION}-linux.jar"
          find "$OUT" -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release-assets/ \;

          test -n "$(find release-assets -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.rpm' -print -quit)"

      - name: Smoke test packaged Linux application and diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=nexu-app/target/jpackage/NexU/nexu-config.properties
          sed -i 's/binding_ports=9795/binding_ports=19795/' "$CONFIG"
          sed -i 's#cors_allowed_origin=\*#cors_allowed_origin=http://localhost:8080#' "$CONFIG"

          CONSOLE_LOG=nexu-app/target/jpackage/nexu-prerelease-smoke.log
          DIAGNOSTIC_DIR="$RUNNER_TEMP/nexu-diagnostic-logs"
          rm -rf "$DIAGNOSTIC_DIR"
          mkdir -p "$DIAGNOSTIC_DIR"

          NEXU_LOG_DIR="$DIAGNOSTIC_DIR" \
            xvfb-run -a nexu-app/target/jpackage/NexU/bin/NexU \
            >"$CONSOLE_LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          READY=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19795/v1/status \
                | grep -q '"protocol":"nexu:1.25"'; then
              READY=true
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$CONSOLE_LOG"
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" != true ]; then
            cat "$CONSOLE_LOG"
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:19795/nexu-info \
            | grep -Eq '"version"[[:space:]]*:[[:space:]]*"1\.25\.0-SNAPSHOT"'

          for attempt in $(seq 1 20); do
            if [ -s "$DIAGNOSTIC_DIR/nexu.log" ]; then break; fi
            sleep 0.5
          done

          test -s "$DIAGNOSTIC_DIR/nexu.log"
          grep -q 'NexU diagnostic logging initialized' "$DIAGNOSTIC_DIR/nexu.log"
          grep -q 'level=DEBUG' "$DIAGNOSTIC_DIR/nexu.log"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: nexu-linux-prerelease
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows packages
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cmd.exe /d /s /c "mvn --batch-mode --errors -pl nexu-app -am -Dmaven.test.skip=true package > windows-build.log 2>&1"
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Get-Content windows-build.log -Tail 180
            exit $status
          }

      - name: Upload Windows Maven diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexu-windows-build-log
          path: windows-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            $wixBin = Get-ChildItem -Path (Join-Path $programFilesX86 'WiX Toolset v3.*\bin') `
              -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wixBin) { throw 'WiX Toolset installation directory was not found' }
            $wixBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$($wixBin.FullName);$env:PATH"
          }

      - name: Build portable ZIP, EXE and MSI
        shell: pwsh
        run: |
          $rcNumber = [int]$env:GITHUB_RUN_NUMBER - [int]$env:RC_RUN_OFFSET
          if ($rcNumber -lt 1) { throw "Invalid release-candidate number: $rcNumber" }
          $releaseVersion = "$env:BASE_VERSION-rc.$rcNumber"
          $out = 'nexu-app/target/jpackage'

          ./nexu-app/src/jpackage/package-windows.ps1 `
            -JarPath nexu-app/target/nexu-app.jar `
            -Destination $out `
            -AppVersion $env:BASE_VERSION

          if (-not (Test-Path "$out/NexU/LOGS.txt" -PathType Leaf)) {
            throw 'Portable diagnostic log guide missing'
          }

          jpackage `
            --type msi `
            --app-image "$out/NexU" `
            --app-version $env:BASE_VERSION `
            --dest $out

          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item nexu-app/target/nexu-app.jar `
            "release-assets/nexu-app-$releaseVersion-windows.jar"
          Get-ChildItem $out -File | Where-Object {
            $_.Extension -in '.zip', '.exe', '.msi'
          } | Copy-Item -Destination release-assets

          if (-not (Get-ChildItem release-assets -Filter '*.zip')) { throw 'Portable ZIP missing' }
          if (-not (Get-ChildItem release-assets -Filter '*.exe')) { throw 'EXE installer missing' }
          if (-not (Get-ChildItem release-assets -Filter '*.msi')) { throw 'MSI installer missing' }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: nexu-windows-prerelease
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub pre-release
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: spring-boot-modernization-2
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: nexu-*-prerelease
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          RC_NUMBER="$((GITHUB_RUN_NUMBER - RC_RUN_OFFSET))"
          if [ "$RC_NUMBER" -lt 1 ]; then
            echo "Invalid release-candidate number: $RC_NUMBER" >&2
            exit 1
          fi
          TAG="v${BASE_VERSION}-rc.${RC_NUMBER}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RC_NUMBER=$RC_NUMBER" >> "$GITHUB_ENV"

          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cd ..

          cat > release-notes.md <<EOF
          ## NexU ${BASE_VERSION} release candidate ${RC_NUMBER}

          Pre-release generated from the \`${SOURCE_BRANCH}\` branch.

          ### Validation
          - Java 21 Maven reactor and automated tests
          - NexU 1.25 application and protocol checks
          - Spring Boot 4.1.0, Spring Framework 7 and Tomcat 11 runtime checks
          - Linux packaged application smoke test on \`/v1/status\` and \`/nexu-info\`
          - RPM internal version verification

          ### Operator packages
          - Windows portable ZIP
          - Windows EXE installer
          - Windows MSI installer
          - Debian/Ubuntu DEB package
          - RPM package
          - Linux portable archive
          - platform-specific executable Spring Boot JARs
          - SHA-256 checksums

          ### Runtime
          - Java 21 runtime included in native packages
          - Spring Boot 4.1.0
          - Spring Framework 7.0.x
          - Tomcat 11.0.x
          - DSS 6.4
          - Bouncy Castle 1.84
          - JavaFX 21.0.11

          ### Important
          These packages are unsigned release-candidate artifacts. Windows SmartScreen and Linux package tools may display an unknown-publisher warning. Vendor-specific smart-card middleware is not bundled.
          EOF

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "NexU ${BASE_VERSION} RC ${RC_NUMBER}" \
            --notes-file release-notes.md \
            --prerelease

  report:
    name: Record pre-release result
    if: always()
    needs:
      - linux
      - windows
      - release
    runs-on: ubuntu-latest

    steps:
      - name: Check out modernization branch
        uses: actions/checkout@v4
        with:
          ref: spring-boot-modernization-2
          fetch-depth: 0

      - name: Write release result
        shell: bash
        run: |
          RC_NUMBER="$((GITHUB_RUN_NUMBER - RC_RUN_OFFSET))"
          TAG="v${BASE_VERSION}-rc.${RC_NUMBER}"
          if [ "${{ needs.release.result }}" = "success" ]; then
            STATUS=published
          else
            STATUS=failed
          fi

          mkdir -p .github/release-status
          cat > .github/release-status/latest.md <<EOF
          # Latest NexU pre-release

          - Tag: \`${TAG}\`
          - Source branch: \`${SOURCE_BRANCH}\`
          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Linux job: \`${{ needs.linux.result }}\`
          - Windows job: \`${{ needs.windows.result }}\`
          - Release job: \`${{ needs.release.result }}\`
          - Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}
          - Status: \`${STATUS}\`
          EOF

      - name: Commit release result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/release-status/latest.md
          git diff --cached --quiet && exit 0
          git commit -m "Record pre-release workflow ${GITHUB_RUN_ID} result"
          git pull --rebase origin "$SOURCE_BRANCH"
          git push origin "HEAD:$SOURCE_BRANCH"
