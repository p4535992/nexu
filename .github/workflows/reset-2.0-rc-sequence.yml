name: Reset NexU 2.0 RC sequence

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/reset-2.0-rc-sequence.yml'

permissions:
  contents: write
  actions: write

jobs:
  reset-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Correct the 2.0 release-candidate counter
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/prerelease-master.yml')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'env:\n  BASE_VERSION: 2.0.0\n':
                  'env:\n  BASE_VERSION: 2.0.0\n  RC_RUN_OFFSET: 19\n',
              '          RELEASE_VERSION="${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"\n':
                  '          RC_NUMBER="$((GITHUB_RUN_NUMBER - RC_RUN_OFFSET))"\n'
                  '          RELEASE_VERSION="${BASE_VERSION}-rc.${RC_NUMBER}"\n',
              '          $releaseVersion = "$env:BASE_VERSION-rc.$env:GITHUB_RUN_NUMBER"\n':
                  '          $rcNumber = [int]$env:GITHUB_RUN_NUMBER - [int]$env:RC_RUN_OFFSET\n'
                  '          $releaseVersion = "$env:BASE_VERSION-rc.$rcNumber"\n',
              '          TAG="v${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"\n':
                  '          RC_NUMBER="$((GITHUB_RUN_NUMBER - RC_RUN_OFFSET))"\n'
                  '          if [ "$RC_NUMBER" -lt 1 ]; then\n'
                  '            echo "Invalid release-candidate number: $RC_NUMBER" >&2\n'
                  '            exit 1\n'
                  '          fi\n'
                  '          TAG="v${BASE_VERSION}-rc.${RC_NUMBER}"\n',
              '          ## NexU ${BASE_VERSION} release candidate ${GITHUB_RUN_NUMBER}\n':
                  '          ## NexU ${BASE_VERSION} release candidate ${RC_NUMBER}\n',
              '            --title "NexU ${BASE_VERSION} RC ${GITHUB_RUN_NUMBER}" \\\n':
                  '            --title "NexU ${BASE_VERSION} RC ${RC_NUMBER}" \\\n',
          }

          expected_counts = {
              'env:\n  BASE_VERSION: 2.0.0\n': 1,
              '          RELEASE_VERSION="${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"\n': 1,
              '          $releaseVersion = "$env:BASE_VERSION-rc.$env:GITHUB_RUN_NUMBER"\n': 1,
              '          TAG="v${BASE_VERSION}-rc.${GITHUB_RUN_NUMBER}"\n': 2,
              '          ## NexU ${BASE_VERSION} release candidate ${GITHUB_RUN_NUMBER}\n': 1,
              '            --title "NexU ${BASE_VERSION} RC ${GITHUB_RUN_NUMBER}" \\\n': 1,
          }

          for old, expected in expected_counts.items():
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s), found {actual}: {old!r}')
              text = text.replace(old, replacements[old])

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -q 'RC_RUN_OFFSET: 19' .github/workflows/prerelease-master.yml
          grep -q 'TAG="v${BASE_VERSION}-rc.${RC_NUMBER}"' .github/workflows/prerelease-master.yml

      - name: Commit the permanent fix and remove this one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reset-2.0-rc-sequence.yml
          git add .github/workflows/prerelease-master.yml
          git commit -m 'Start NexU 2.0 release candidates at rc.1'
          git push origin HEAD:master

      - name: Dispatch the corrected pre-release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          expected=$(git rev-parse HEAD)
          for attempt in $(seq 1 20); do
            current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
            if [ "$current" = "$expected" ]; then
              break
            fi
            sleep 2
          done
          test "$current" = "$expected"
          gh workflow run prerelease-master.yml --ref master
