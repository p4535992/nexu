# Cross-platform stable release build for the local NexU operator application.
name: Publish NexU release

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-master.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexu-release-master
  cancel-in-progress: false

env:
  BASE_VERSION: 1.24.0

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install packaging and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot rpm libpcsclite1 pcscd xvfb

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode --errors clean verify 2>&1 | tee linux-verify.log

      - name: Build portable, DEB and RPM packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="nexu-app/target/jpackage"

          bash nexu-app/src/jpackage/package-linux.sh \
            nexu-app/target/nexu-app.jar \
            "$OUT" \
            "$BASE_VERSION"

          jpackage \
            --type rpm \
            --app-image "$OUT/NexU" \
            --dest "$OUT"

          test -f "$OUT/NexU/LOGS.txt"

          mkdir -p release-assets
          cp nexu-app/target/nexu-app.jar \
            "release-assets/nexu-app-${BASE_VERSION}-linux.jar"
          find "$OUT" -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release-assets/ \;

          test -n "$(find release-assets -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.rpm' -print -quit)"

      - name: Smoke test packaged Linux application and diagnostic log
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=nexu-app/target/jpackage/NexU/nexu-config.properties
          sed -i 's/binding_ports=9795/binding_ports=19795/' "$CONFIG"
          sed -i 's#cors_allowed_origin=\*#cors_allowed_origin=http://localhost:8080#' "$CONFIG"

          CONSOLE_LOG=nexu-app/target/jpackage/nexu-release-smoke.log
          DIAGNOSTIC_DIR="$RUNNER_TEMP/nexu-diagnostic-logs"
          rm -rf "$DIAGNOSTIC_DIR"
          mkdir -p "$DIAGNOSTIC_DIR"

          NEXU_LOG_DIR="$DIAGNOSTIC_DIR" \
            xvfb-run -a nexu-app/target/jpackage/NexU/bin/NexU \
            >"$CONSOLE_LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          READY=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19795/v1/status \
                | grep -q '"protocol":"nexu:2.0"'; then
              READY=true
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$CONSOLE_LOG"
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" != true ]; then
            cat "$CONSOLE_LOG"
            exit 1
          fi

          for attempt in $(seq 1 20); do
            if [ -s "$DIAGNOSTIC_DIR/nexu.log" ]; then
              break
            fi
            sleep 0.5
          done

          test -s "$DIAGNOSTIC_DIR/nexu.log"
          grep -q 'NexU diagnostic logging initialized' "$DIAGNOSTIC_DIR/nexu.log"
          grep -q 'level=DEBUG' "$DIAGNOSTIC_DIR/nexu.log"

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: nexu-linux-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows packages
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Check out master
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          cmd.exe /d /s /c "mvn --batch-mode --errors -pl nexu-app -am -Dmaven.test.skip=true package > windows-build.log 2>&1"
          $status = $LASTEXITCODE
          if ($status -ne 0) {
            Get-Content windows-build.log -Tail 180
            exit $status
          }

      - name: Upload Windows Maven diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexu-windows-release-build-log
          path: windows-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Ensure WiX Toolset is available
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --yes --no-progress
            $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
            $wixBin = Get-ChildItem -Path (Join-Path $programFilesX86 'WiX Toolset v3.*\bin') `
              -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wixBin) { throw 'WiX Toolset installation directory was not found' }
            $wixBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$($wixBin.FullName);$env:PATH"
          }

      - name: Build portable ZIP, EXE and MSI
        shell: pwsh
        run: |
          $out = 'nexu-app/target/jpackage'

          ./nexu-app/src/jpackage/package-windows.ps1 `
            -JarPath nexu-app/target/nexu-app.jar `
            -Destination $out `
            -AppVersion $env:BASE_VERSION

          if (-not (Test-Path "$out/NexU/LOGS.txt" -PathType Leaf)) {
            throw 'Portable diagnostic log guide missing'
          }

          jpackage `
            --type msi `
            --app-image "$out/NexU" `
            --dest $out

          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item nexu-app/target/nexu-app.jar `
            "release-assets/nexu-app-$env:BASE_VERSION-windows.jar"
          Get-ChildItem $out -File | Where-Object {
            $_.Extension -in '.zip', '.exe', '.msi'
          } | Copy-Item -Destination release-assets

          if (-not (Get-ChildItem release-assets -Filter '*.zip')) { throw 'Portable ZIP missing' }
          if (-not (Get-ChildItem release-assets -Filter '*.exe')) { throw 'EXE installer missing' }
          if (-not (Get-ChildItem release-assets -Filter '*.msi')) { throw 'MSI installer missing' }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: nexu-windows-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs:
      - linux
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: nexu-*-release
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${BASE_VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cd ..

          cat > release-notes.md <<EOF
          ## NexU ${BASE_VERSION}

          Stable community release of the modernized NexU local signing agent.

          ### Highlights
          - Java 17, Spring Boot 3.5.16, DSS 6.4 and JavaFX 21.0.11
          - legacy DSS browser-signing compatibility through `/rest/certificates` and `/rest/sign`
          - HTTPS browser integration through `https://localhost:9895`
          - per-installation localhost certificate and browser-enablement tray guidance
          - contextual certificate-access and private-key password prompts
          - smart cards, Windows certificate store, JKS and PKCS#12 signing sources
          - English and Italian desktop interface
          - rotating diagnostic logs and verified shutdown helpers

          ### Operator packages
          - Windows portable ZIP
          - Windows EXE installer
          - Windows MSI installer
          - Debian/Ubuntu DEB package
          - RPM package
          - Linux portable archive
          - platform-specific executable Spring Boot JARs
          - SHA-256 checksums

          ### Before production use
          Test the complete signing workflow with the actual smart cards, middleware, keystores, browser and remote signing backend. Independently validate signed documents and certificate chains. These community packages are currently unsigned, so operating systems may display an unknown-publisher warning.

          Vendor-specific smart-card middleware is not bundled. A WAR is intentionally not produced because NexU is a local desktop signing agent with JavaFX and notification-area lifecycle, not a servlet-container application.
          EOF

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "NexU ${BASE_VERSION}" \
            --notes-file release-notes.md \
            --latest

  report:
    name: Record stable release result
    if: always()
    needs:
      - linux
      - windows
      - release
    runs-on: ubuntu-latest

    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Write release result
        shell: bash
        run: |
          TAG="v${BASE_VERSION}"
          if [ "${{ needs.release.result }}" = "success" ]; then
            STATUS=published
          else
            STATUS=failed
          fi

          mkdir -p .github/release-status
          cat > .github/release-status/stable.md <<EOF
          # Latest stable NexU release

          - Tag: \`${TAG}\`
          - Source branch: \`master\`
          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Linux job: \`${{ needs.linux.result }}\`
          - Windows job: \`${{ needs.windows.result }}\`
          - Release job: \`${{ needs.release.result }}\`
          - Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}
          - Status: \`${STATUS}\`
          EOF

      - name: Commit release result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/release-status/stable.md
          git diff --cached --quiet && exit 0
          git commit -m "Record stable release workflow ${GITHUB_RUN_ID} result"
          git push origin HEAD:master
