password.title.generic=Password required
password.title.certificate=Keystore certificate access
password.title.private.key=Private-key signing
password.title.combined=Certificate selection and signing

password.prompt.certificate=Enter the local keystore password to open the file and read the certificates available for selection. The password remains inside NexU and is never sent to the DSS website.
password.prompt.private.key=Enter the password needed to reopen the local keystore and unlock the selected private key for this signature. For most PKCS#12 and JKS files, this is the same password used during certificate selection.
password.prompt.combined=Enter the local keystore password. NexU will use it for both certificate selection and the private-key signing step of this DSS operation. The password remains inside NexU and is never sent to the DSS website.
