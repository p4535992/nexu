browser.enable.menu=Enable NexU in browser
browser.enable.dialog.title=Enable NexU in browser
browser.enable.heading=Allow the browser to connect securely to NexU
browser.enable.description=Secure signing websites communicate with NexU through a local HTTPS endpoint. The browser must trust the certificate used by this localhost connection.
browser.enable.instructions=Open the verification page below in the same browser you use for signing. If the browser reports that the certificate is not trusted or valid, follow the browser's standard advanced or continue procedure to accept it. Before proceeding, confirm that the address is exactly the localhost URL shown below.
browser.enable.endpoint.label=Verification page:
browser.enable.security=This action applies only to the local NexU address. Do not disable certificate validation for other websites. If browser policy prevents acceptance, ask your administrator to trust config/localhost.crt.
browser.enable.open=Open verification page
browser.enable.close=Close
browser.enable.status.opened=The verification page was opened in your default browser.
browser.enable.status.error=The browser could not be opened automatically. Copy the address and open it manually.
