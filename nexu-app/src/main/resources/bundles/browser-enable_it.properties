browser.enable.menu=Abilita NexU nel browser
browser.enable.dialog.title=Abilita NexU nel browser
browser.enable.heading=Consenti al browser di comunicare in modo sicuro con NexU
browser.enable.description=I siti di firma sicuri comunicano con NexU tramite un endpoint HTTPS locale. Il browser deve considerare attendibile il certificato utilizzato da questa connessione localhost.
browser.enable.instructions=Apri la pagina di verifica indicata di seguito nello stesso browser utilizzato per la firma. Se il browser segnala che il certificato non è attendibile o non è valido, segui la procedura standard del browser, normalmente disponibile nelle opzioni avanzate, per continuare e accettarlo. Prima di procedere, verifica che l'indirizzo corrisponda esattamente all'URL localhost mostrato di seguito.
browser.enable.endpoint.label=Pagina di verifica:
browser.enable.security=Questa operazione riguarda esclusivamente l'indirizzo locale di NexU. Non disabilitare la verifica dei certificati per altri siti. Se i criteri del browser impediscono l'accettazione, chiedi all'amministratore di considerare attendibile config/localhost.crt.
browser.enable.open=Apri la pagina di verifica
browser.enable.close=Chiudi
browser.enable.status.opened=La pagina di verifica è stata aperta nel browser predefinito.
browser.enable.status.error=Non è stato possibile aprire automaticamente il browser. Copia l'indirizzo e aprilo manualmente.
