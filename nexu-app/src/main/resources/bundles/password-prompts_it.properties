password.title.generic=Password richiesta
password.title.certificate=Accesso ai certificati del keystore
password.title.private.key=Firma con la chiave privata
password.title.combined=Selezione del certificato e firma

password.prompt.certificate=Inserisci la password del keystore locale per aprire il file e leggere i certificati disponibili per la selezione. La password resta all'interno di NexU e non viene mai inviata al sito DSS.
password.prompt.private.key=Inserisci la password necessaria per riaprire il keystore locale e sbloccare la chiave privata selezionata per questa firma. Per la maggior parte dei file PKCS#12 e JKS coincide con la password usata durante la selezione del certificato.
password.prompt.combined=Inserisci la password del keystore locale. NexU la userà sia per selezionare il certificato sia per firmare con la chiave privata durante questa operazione DSS. La password resta all'interno di NexU e non viene mai inviata al sito DSS.
